apiVersion: apps/v1
kind: Deployment
metadata:
  name: small-project
  labels:
    app: small-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: small-project
  template:
    metadata:
      labels:
        app: small-project
    spec:
      containers:
        - name: small-project
          image: ${{ secrets.DOCKER_USERNAME }}/small-project:latest
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10